const TOTAL_SECONDS = 45 * 60;
let remaining = TOTAL_SECONDS;
let timerInterval = null;
let submitted = false;
const answers = {}; // num -> selected index

const optLetters = ['A','B','C','D'];

function renderQuiz() {
  const container = document.getElementById('quiz-container');
  container.innerHTML = '';
  let currentSection = null;
  let currentChapter = null;

  // count questions per section for header
  const sectionCounts = {};
  QUIZ_DATA.forEach(q => { sectionCounts[q.section] = (sectionCounts[q.section]||0) + 1; });

  QUIZ_DATA.forEach(item => {
    if (item.section !== currentSection) {
      currentSection = item.section;
      const h = document.createElement('div');
      h.className = 'section-heading';
      h.innerHTML = item.section + '<span class="count">' + sectionCounts[item.section] + ' questions</span>';
      container.appendChild(h);
      currentChapter = null;
    }

    const card = document.createElement('div');
    card.className = 'q-card';
    card.id = 'card-' + item.num;

    let chapterHtml = '';
    if (item.chapter !== currentChapter) {
      currentChapter = item.chapter;
    }
    chapterHtml = '<div class="chapter-tag">' + item.chapter + '</div>';

    const headerDiv = document.createElement('div');
    headerDiv.innerHTML = chapterHtml;
    card.appendChild(headerDiv);

    const qHeader = document.createElement('div');
    qHeader.className = 'q-header';
    qHeader.innerHTML = '<div class="q-num">' + item.num + '</div><div class="q-text">' + escapeHtml(item.q) + '</div><div class="q-status-badge" id="badge-' + item.num + '"></div>';
    card.appendChild(qHeader);

    const optionsDiv = document.createElement('div');
    optionsDiv.className = 'options';
    item.opts.forEach((opt, idx) => {
      const optDiv = document.createElement('label');
      optDiv.className = 'option';
      optDiv.id = 'opt-' + item.num + '-' + idx;
      optDiv.innerHTML = '<input type="radio" name="q' + item.num + '" value="' + idx + '"><span class="opt-letter">' + optLetters[idx] + '.</span><span class="opt-text">' + escapeHtml(opt) + '</span><span class="result-icon" id="icon-' + item.num + '-' + idx + '"></span>';
      optDiv.addEventListener('click', () => selectAnswer(item.num, idx));
      optionsDiv.appendChild(optDiv);
    });
    card.appendChild(optionsDiv);

    const expDiv = document.createElement('div');
    expDiv.className = 'explanation';
    expDiv.id = 'exp-' + item.num;
    expDiv.innerHTML = '<strong>Explanation:</strong> ' + escapeHtml(item.exp);
    card.appendChild(expDiv);

    container.appendChild(card);
  });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function selectAnswer(num, idx) {
  if (submitted) return;
  answers[num] = idx;
  document.querySelectorAll('#card-' + num + ' .option').forEach(o => o.classList.remove('selected'));
  document.getElementById('opt-' + num + '-' + idx).classList.add('selected');
  document.querySelector('#card-' + num + ' input[value="' + idx + '"]').checked = true;
  updateProgress();
}

function updateProgress() {
  const answeredCount = Object.keys(answers).length;
  document.getElementById('answered-count').textContent = answeredCount + ' / ' + QUIZ_DATA.length + ' answered';
  document.getElementById('progress-bar').style.width = (answeredCount / QUIZ_DATA.length * 100) + '%';
}

function formatTime(sec) {
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}

function startTimer() {
  const box = document.getElementById('timer-box');
  timerInterval = setInterval(() => {
    remaining--;
    if (remaining <= 0) {
      remaining = 0;
      box.textContent = formatTime(remaining);
      clearInterval(timerInterval);
      submitTest(true);
      return;
    }
    box.textContent = formatTime(remaining);
    if (remaining <= 300) {
      box.classList.add('warning');
    }
  }, 1000);
}

function submitTest(auto) {
  if (submitted) return;
  submitted = true;
  clearInterval(timerInterval);
  document.getElementById('submit-btn').disabled = true;
  document.getElementById('submit-btn').textContent = 'Submitted';

  let correctCount = 0, wrongCount = 0, skippedCount = 0;
  const chapterStats = {}; // chapter -> {correct, wrong, skipped, total}

  QUIZ_DATA.forEach(item => {
    const num = item.num;
    const userAns = answers.hasOwnProperty(num) ? answers[num] : null;
    const correctIdx = item.ans;
    const badge = document.getElementById('badge-' + num);
    const card = document.getElementById('card-' + num);

    // disable further interaction
    document.querySelectorAll('#card-' + num + ' input').forEach(inp => inp.disabled = true);
    document.querySelectorAll('#card-' + num + ' .option').forEach(o => o.style.cursor = 'default');

    // mark correct answer
    document.getElementById('opt-' + num + '-' + correctIdx).classList.add('correct-answer');
    document.getElementById('icon-' + num + '-' + correctIdx).textContent = '\u2713';
    document.getElementById('icon-' + num + '-' + correctIdx).classList.add('tick');

    if (!chapterStats[item.chapter]) {
      chapterStats[item.chapter] = { correct: 0, wrong: 0, skipped: 0, total: 0, section: item.section };
    }
    chapterStats[item.chapter].total++;

    if (userAns === null) {
      skippedCount++;
      badge.textContent = 'SKIPPED';
      badge.classList.add('skipped');
      chapterStats[item.chapter].skipped++;
    } else if (userAns === correctIdx) {
      correctCount++;
      badge.textContent = 'CORRECT';
      badge.classList.add('correct');
      chapterStats[item.chapter].correct++;
    } else {
      wrongCount++;
      badge.textContent = 'WRONG';
      badge.classList.add('wrong');
      document.getElementById('opt-' + num + '-' + userAns).classList.add('wrong-answer');
      document.getElementById('icon-' + num + '-' + userAns).textContent = '\u2717';
      document.getElementById('icon-' + num + '-' + userAns).classList.add('cross');
      chapterStats[item.chapter].wrong++;
    }

    // show explanation
    document.getElementById('exp-' + num).style.display = 'block';
  });

  // Negative marking: +1 correct, -1/3 wrong, 0 skipped
  const netScore = correctCount * 1 - wrongCount * (1/3);
  const netScoreDisplay = (Math.round(netScore * 100) / 100).toString();
  const attempted = correctCount + wrongCount;
  const accuracy = attempted > 0 ? Math.round((correctCount / attempted) * 100) : 0;

  // show score modal
  document.getElementById('score-big').innerHTML = netScoreDisplay + '<span> / ' + QUIZ_DATA.length + '</span>';
  document.getElementById('stat-correct').textContent = correctCount;
  document.getElementById('stat-wrong').textContent = wrongCount;
  document.getElementById('stat-skipped').textContent = skippedCount;
  document.getElementById('stat-accuracy').textContent = accuracy + '%';

  // Topic-wise analysis, weakest (most wrong) topics first
  const chapterRows = document.getElementById('chapter-analysis-rows');
  chapterRows.innerHTML = '';
  const chapterList = Object.keys(chapterStats).map(ch => ({ name: ch, ...chapterStats[ch] }));
  chapterList.sort((a, b) => (b.wrong - a.wrong) || (b.skipped - a.skipped));
  chapterList.forEach(ch => {
    const correctPct = (ch.correct / ch.total) * 100;
    const wrongPct = (ch.wrong / ch.total) * 100;
    const skippedPct = (ch.skipped / ch.total) * 100;
    const row = document.createElement('div');
    row.className = 'topic-row';
    row.innerHTML =
      '<div class="topic-name">' + escapeHtml(ch.name) + '</div>' +
      '<div class="topic-bar-wrap">' +
        '<div class="topic-bar-correct" style="width:' + correctPct + '%"></div>' +
        '<div class="topic-bar-wrong" style="width:' + wrongPct + '%"></div>' +
        '<div class="topic-bar-skipped" style="width:' + skippedPct + '%"></div>' +
      '</div>' +
      '<div class="topic-counts"><span class="c">' + ch.correct + 'c</span> <span class="w">' + ch.wrong + 'w</span> <span class="s">' + ch.skipped + 's</span></div>';
    chapterRows.appendChild(row);
  });

  document.getElementById('score-modal-overlay').style.display = 'flex';
}

document.getElementById('submit-btn').addEventListener('click', () => {
  if (submitted) return;
  const answeredCount = Object.keys(answers).length;
  if (answeredCount < QUIZ_DATA.length) {
    const remaining_q = QUIZ_DATA.length - answeredCount;
    const ok = confirm(remaining_q + ' question(s) are still unanswered. Submit anyway?');
    if (!ok) return;
  }
  submitTest(false);
});

document.getElementById('view-answers-btn').addEventListener('click', () => {
  document.getElementById('score-modal-overlay').style.display = 'none';
  window.scrollTo({top: 0, behavior: 'smooth'});
});

document.getElementById('modal-restart-btn').addEventListener('click', () => {
  window.location.reload();
});

renderQuiz();
updateProgress();
startTimer();
</script>

</body>
</html>
