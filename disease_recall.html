            { name: "Thalassemia", defect: "Deficient alpha or beta globin protein chain synthesis", pattern: "Autosomal recessive inherited blood disorder", symptoms: "Fewer RBCs, low haemoglobin, mild-to-severe anaemia, bone deformities" },
            { name: "Colour Blindness (Daltonism)", defect: "Defect in one or more colour-sensing cone cell genes", pattern: "X-linked recessive", symptoms: "Decreased ability to distinguish colours (commonly red-green)" },
            { name: "Down Syndrome", defect: "Trisomy 21 — non-disjunction error", pattern: "Chromosomal aberration (47 chromosomes)", symptoms: "Flat facial features, small head/ears, short neck, poor muscle tone, intellectual disability" },
            { name: "Turner Syndrome", defect: "Partial/complete loss of one X chromosome", pattern: "Chromosomal aberration (45, XO — affects females)", symptoms: "Short height, webbed neck, low-set ears, sterile ovaries, heart defects" },
            { name: "Klinefelter Syndrome", defect: "Extra X chromosome in males", pattern: "Chromosomal aberration (47, XXY)", symptoms: "Gynecomastia, less body hair, sterile, longer limbs, wider hips" },
            { name: "Super Male (Jacob Syndrome)", defect: "Extra Y chromosome", pattern: "Chromosomal aberration (47, XYY)", symptoms: "Often taller than average, mild learning difficulties, speech delay" },
            { name: "Super Female (Triple X Syndrome)", defect: "Extra X chromosome in females", pattern: "Chromosomal aberration (47, XXX)", symptoms: "Taller stature, increased risk of learning disabilities or speech delay, normal fertility" },
            { name: "Patau Syndrome", defect: "Trisomy 13 — non-disjunction error", pattern: "Chromosomal aberration (47 chromosomes)", symptoms: "Severe intellectual disability, cleft lip/palate, polydactyly, heart defects (very low survival rate)" },
            { name: "Edward Syndrome", defect: "Trisomy 18 — non-disjunction error", pattern: "Chromosomal aberration (47 chromosomes)", symptoms: "Severe developmental delays, clenched fists with overlapping fingers, microcephaly, congenital heart disease" }
        ];

        let currentTab = 'infectious';
        let currentData = [...infectiousData];
        let revealedStatus = {};

        function switchTab(tabName) {
            currentTab = tabName;
            revealedStatus = {};

            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${tabName}`).classList.add('active');

            if (tabName === 'infectious') {
                currentData = [...infectiousData];
            } else if (tabName === 'deficiency') {
                currentData = [...deficiencyData];
            } else if (tabName === 'genetic') {
                currentData = [...geneticData];
            }

            renderTable();
        }

        function renderTable() {
            const headerTr = document.getElementById('tableHeader');
            const tbody = document.getElementById('diseaseTableBody');
            tbody.innerHTML = '';

            if (currentTab === 'infectious') {
                headerTr.innerHTML = `
                    <th class="p-4 w-1/5">Disease Name</th>
                    <th class="p-4 w-1/6">Pathogen Type</th>
                    <th class="p-4 w-1/5">Causative Agent</th>
                    <th class="p-4 w-1/5">Transmission</th>
                    <th class="p-4 w-1/4">Symptoms / Notes</th>
                `;
            } else if (currentTab === 'deficiency') {
                headerTr.innerHTML = `
                    <th class="p-4 w-1/4">Disease Name</th>
                    <th class="p-4 w-1/4">Cause / Deficiency</th>
                    <th class="p-4 w-1/5">Affected Organ / System</th>
                    <th class="p-4 w-3/10">Key Symptoms</th>
                `;
            } else if (currentTab === 'genetic') {
                headerTr.innerHTML = `
                    <th class="p-4 w-1/4">Disease / Syndrome Name</th>
                    <th class="p-4 w-1/3">Genetic Defect / Cause</th>
                    <th class="p-4 w-1/5">Inheritance / Pattern</th>
                    <th class="p-4 w-3/10">Key Symptoms</th>
                `;
            }

            currentData.forEach((item, index) => {
                const tr = document.createElement('tr');
                tr.className = index % 2 === 0 ? 'bg-slate-800' : 'bg-slate-850';
                
                const isRevealed = revealedStatus[index] || false;

                if (currentTab === 'infectious') {
                    if (isRevealed) {
                        tr.innerHTML = `
                            <td class="p-4 font-semibold text-cyan-300">${item.name}</td>
                            <td class="p-4"><span class="px-2.5 py-1 rounded text-xs font-bold ${item.badge}">${item.type}</span></td>
                            <td class="p-4 text-slate-300 italic">${item.agent}</td>
                            <td class="p-4 text-slate-300">${item.transmission}</td>
                            <td class="p-4 text-slate-400 text-xs">${item.notes}</td>
                        `;
                    } else {
                        tr.innerHTML = `
                            <td class="p-4 font-semibold text-cyan-300">${item.name}</td>
                            <td colspan="4" class="p-2">
                                <div class="hidden-details" onclick="revealRow(${index})">Click to Reveal Details</div>
                            </td>
                        `;
                    }
                } else if (currentTab === 'deficiency') {
                    if (isRevealed) {
                        tr.innerHTML = `
                            <td class="p-4 font-semibold text-cyan-300">${item.name}</td>
                            <td class="p-4 text-slate-300 font-medium">${item.cause}</td>
                            <td class="p-4 text-amber-300">${item.organ}</td>
                            <td class="p-4 text-slate-400 text-xs">${item.symptoms}</td>
                        `;
                    } else {
                        tr.innerHTML = `
                            <td class="p-4 font-semibold text-cyan-300">${item.name}</td>
                            <td colspan="3" class="p-2">
                                <div class="hidden-details" onclick="revealRow(${index})">Click to Reveal Cause & Symptoms</div>
                            </td>
                        `;
                    }
                } else if (currentTab === 'genetic') {
                    if (isRevealed) {
                        tr.innerHTML = `
                            <td class="p-4 font-semibold text-cyan-300">${item.name}</td>
                            <td class="p-4 text-slate-300 font-medium">${item.defect}</td>
                            <td class="p-4 text-purple-300 text-xs font-semibold">${item.pattern}</td>
                            <td class="p-4 text-slate-400 text-xs">${item.symptoms}</td>
                        `;
                    } else {
                        tr.innerHTML = `
                            <td class="p-4 font-semibold text-cyan-300">${item.name}</td>
                            <td colspan="3" class="p-2">
                                <div class="hidden-details" onclick="revealRow(${index})">Click to Reveal Genetics & Symptoms</div>
                            </td>
                        `;
                    }
                }
                tbody.appendChild(tr);
            });
        }

        function revealRow(index) {
            revealedStatus[index] = true;
            renderTable();
        }

        function shuffleCurrentTable() {
            revealedStatus = {};
            for (let i = currentData.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [currentData[i], currentData[j]] = [currentData[j], currentData[i]];
            }
            renderTable();
        }

        function revealAllCurrent() {
            currentData.forEach((_, index) => {
                revealedStatus[index] = true;
            });
            renderTable();
        }

        function resetCurrent() {
            revealedStatus = {};
            renderTable();
        }

        // Initial load
        window.onload = () => {
            switchTab('infectious');
        };
    </script>
</body>
</html>
