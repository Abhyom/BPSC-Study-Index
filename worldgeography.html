const tabs=document.getElementById('tabs'),out=document.getElementById('out');
const amp=t=>t.replace(/&(?!lt;)/g,'&amp;');
function splitTop(t,f){const o=[];let d=0,c='';for(let i=0;i<t.length;i++){const ch=t[i];if('([{“'.includes(ch))d++;if(')]}”'.includes(ch))d--;if(d<=0&&f(t,i)){o.push(c.trim());c=''}else c+=ch}o.push(c.trim());return o.filter(Boolean)}
const arrows=t=>splitTop(t,(s,i)=>s[i]==='→');
const items=t=>splitTop(t,(s,i)=>s[i]===','||(s[i]==='+'&&s[i-1]===' '&&s[i+1]===' ')).map(x=>x.replace(/^(and|\+)\s+/i,''));
const sp=z=>'<span class="l">'+z+'</span>';
function step(x,i){
  let m=x.match(/^([^:,]{1,48}):\s+(.+)$/)||x.match(/^(Comprises|Includes)\s+(.+)$/);
  let h;
  if(m){const it=items(m[2]);h=it.length>1?sp(m[1]+(x.includes(':')?':':''))+it.map(z=>'<span class="l i">'+z+'</span>').join(''):sp(x)}
  else h=items(x).map(sp).join('');
  return '<div class="s'+(i?' n':'')+'">'+h+'</div>';
}
const fmt=t=>amp(t).split(/¶|\s\|\s/).map(g=>'<div class="g">'+arrows(g).map(step).join('')+'</div>').join('');
const esc=fmt;
function show(name){
  [...tabs.children].forEach(b=>b.setAttribute('aria-selected',b.dataset.n===name));
  out.innerHTML=D[name].map(([h,rows])=>'<h2>'+h+'</h2><div class="tw"><table><thead><tr><th>Entity / Region</th><th>Chained Facts &amp; One-Liners</th></tr></thead><tbody>'+rows.map(r=>'<tr><td>'+amp(r[0])+'</td><td>'+esc(r[1])+'</td></tr>').join('')+'</tbody></table></div>').join('');
  try{scrollTo(0,0)}catch(e){}
}
Object.keys(D).forEach(n=>{const b=document.createElement('button');b.textContent=n;b.dataset.n=n;b.role='tab';b.onclick=()=>show(n);tabs.appendChild(b)});
show('Asia');
