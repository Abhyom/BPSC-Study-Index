    {q:"The Kanva dynasty was ended by Simuka, founder of which dynasty, after killing Susharma?", opts:["Satavahana dynasty","Kushan dynasty","Gupta dynasty","Shunga dynasty"], a:0, e:"Simuka, founder of the <b>Satavahana dynasty</b>, killed Susharma to end the Kanva dynasty."},
    {q:"The Kushans belonged to which tribe of China?", opts:["Yeuchi/Tokhari","Huna","Shaka","Pahlava"], a:0, e:"Kushans belonged to the <b>Yeuchi/Tokhari</b> tribe of China."},
    {q:"The founder of the Kushan dynasty was:", opts:["Kanishka","Kujula Kadphises","Vima Kadphises","Vasudeva"], a:1, e:"<b>Kujula Kadphises</b> founded the Kushan dynasty; Kanishka was its most prominent later ruler."},
    {q:"Kanishka started the Shaka era in which year?", opts:["58 BC","78 AD","120 AD","320 AD"], a:1, e:"Kanishka began the <b>Shaka era in 78 AD</b> upon becoming king — do not confuse this with the Vikram Samvat (58 BC) or Gupta era (320 AD)."},
    {q:"Ashvaghosha, author of the Buddhacharita, served as Vice Chairman at the Fourth Buddhist Council alongside:", opts:["Vasumitra","Moggaliputta Tissa","Nagarjuna","Nagasena"], a:0, e:"<b>Vasumitra</b> chaired the Fourth Buddhist Council with Ashvaghosha as Vice Chairman."}
  ]
},
{
  title: "Gupta Dynasty",
  qs: [
    {q:"The Gupta dynasty was founded by Sri Gupta; the first ruler to take the title 'Maharaja' was:", opts:["Chandragupta I","Ghatotkach Gupta","Samudragupta","Sri Gupta"], a:1, e:"<b>Ghatotkach Gupta</b>, successor of Sri Gupta, was the first to assume the title Maharaja."},
    {q:"Chandragupta I, considered the real founder of the Gupta dynasty, started the Gupta era in which year?", opts:["78 AD","240 AD","320 AD","335 AD"], a:2, e:"Chandragupta I started the <b>Gupta era in 320 AD</b>, the same year he ascended the throne."},
    {q:"Chandragupta I married the Licchavi princess:", opts:["Kumar Devi","Dhruva Devi","Kubernaga","Prabhavati Gupta"], a:0, e:"Chandragupta I married Licchavi princess <b>Kumar Devi</b>, strengthening Gupta legitimacy."},
    {q:"Historian V.A. Smith gave Samudragupta which epithet?", opts:["Vikramaditya of India","Napoleon of India","Golden Emperor","Ashoka of the Guptas"], a:1, e:"Samudragupta was called the <b>'Napoleon of India'</b> by historian V.A. Smith."},
    {q:"Samudragupta's military campaigns are recorded in the Prayag Prashasti, composed by:", opts:["Kalidasa","Harishena","Vishnusharma","Vasubandhu"], a:1, e:"<b>Harishena</b>, Samudragupta's court poet, composed the Prayag Prashasti (Allahabad Pillar inscription)."},
    {q:"Samudragupta's coins depict him:", opts:["On horseback","Playing veena","Performing yajna","Holding a bow"], a:1, e:"Samudragupta's coins show him <b>playing the veena</b>, reflecting his title 'Kaviraj' and patronage of the arts."},
    {q:"Chandragupta II assumed the title 'Vikramaditya' after defeating the Shakas, in which year?", opts:["375 AD","389 AD","415 AD","455 AD"], a:1, e:"Chandragupta II took the title Vikramaditya in <b>389 AD</b> after his Shaka victory."},
    {q:"Prabhavati Gupta, daughter of Chandragupta II and Kubernaga, was married to which Vakataka king?", opts:["Rudrasen II","Pravarasena","Rudradaman","Vindhyashakti"], a:0, e:"Prabhavati Gupta married Vakataka king <b>Rudrasen II</b>, later ruling as regent for her minor sons."},
    {q:"Which Chinese traveller visited India during Chandragupta II's reign and stayed for 14 years?", opts:["Hiuen Tsang","Fa Hien","I-tsing","Xuanzang"], a:1, e:"<b>Fa Hien</b> stayed in India from 399–414 AD during Chandragupta II's reign — distinct from Hiuen Tsang, who visited later under Harsha."},
    {q:"The Mehrauli Iron Pillar, addressing a ruler as 'Chandra', is believed to belong to:", opts:["Chandragupta I","Chandragupta II","Samudragupta","Kumaragupta I"], a:1, e:"The Mehrauli Iron Pillar is attributed to <b>Chandragupta II</b>, referred to as 'Chandra'."},
    {q:"Which of these was NOT among Chandragupta II's nine gems (Navaratnas)?", opts:["Kalidas","Varahamihir","Harishena","Amar Singh"], a:2, e:"<b>Harishena</b> was Samudragupta's court poet, not one of Chandragupta II's nine gems — a classic trap mixing up two reigns."},
    {q:"Nalanda University was established during the reign of:", opts:["Chandragupta II","Kumaragupta I","Skandagupta","Samudragupta"], a:1, e:"<b>Kumaragupta I</b> established Nalanda University, which later became a major Buddhist learning centre."},
    {q:"Skandagupta's defeat of the Huns is recorded in the Junagadh inscription, where the Huns are referred to as:", opts:["Yavana","Maleccha","Shaka","Pahlava"], a:1, e:"The Junagadh inscription calls the Huns <b>'Maleccha'</b> after Skandagupta drove them out of India."},
    {q:"Skandagupta got which lake, originally built by Chandragupta Maurya, renovated?", opts:["Sudarshan lake","Dal lake","Pushkar lake","Sur Sarovar"], a:0, e:"Skandagupta renovated the <b>Sudarshan lake</b>, originally constructed under Chandragupta Maurya."},
    {q:"The Gupta administrative hierarchy, in descending order, was:", opts:["Desh → Bhukti → Vishaya → Gram","Desh → Chakra → Vishaya → Gram","Rashtra → Mandal → Vishaya → Gram","Bhukti → Desh → Vishaya → Gram"], a:0, e:"The Gupta hierarchy was <b>Desh → Bhukti → Vishaya → Gram</b> — note the Mauryan period instead used 'Chakra' for province, a frequent point of confusion."},
    {q:"In the Gupta period, the gold coin was called Dinar; the silver coin was called:", opts:["Rupyaka","Karshapana","Pana","Nishka"], a:0, e:"The Gupta silver coin was called <b>Rupyaka</b>."},
    {q:"The first evidence of Sati Pratha is found in the Eran inscription of which Gupta-era ruler, dated 510 AD?", opts:["Skandagupta","Bhanugupta","Kumaragupta I","Vishnugupta"], a:1, e:"The Eran inscription of <b>Bhanugupta</b> (510 AD) provides the earliest evidence of Sati Pratha."},
    {q:"Among the Gupta-period cave sites, which pair is correctly matched to their states?", opts:["Ajanta (Maharashtra), Bagh (Madhya Pradesh)","Ajanta (MP), Bagh (Maharashtra)","Barabar (Bihar), Bagh (Maharashtra)","Ajanta (Karnataka), Bagh (Gujarat)"], a:0, e:"<b>Ajanta Caves are in Maharashtra; Bagh Caves are in Madhya Pradesh</b> — both showcase Buddhist and Hindu paintings from the Gupta period."},
    {q:"Aryabhatta's major works include the Aryabhattiyam and:", opts:["Brahma Siddhanta","Suryasiddhanta","Nitisar","Amarkosh"], a:1, e:"Aryabhatta authored the <b>Aryabhattiyam and Suryasiddhanta</b>; Brahma Siddhanta was instead written by Brahmagupta (the 'Newton of India')."},
    {q:"Which historian termed the Gupta period the 'Golden Age' of India?", opts:["V.A. Smith","R.C. Majumdar","D.D. Kosambi","James Prinsep"], a:0, e:"Historian <b>V.A. Smith</b> termed the Gupta era the 'Golden Age' for its cultural achievements."}
  ]
},
{
  title: "Nalanda University",
  qs: [
    {q:"At the time of Hiuen Tsang's visit, the chief teacher (head) of Nalanda University was:", opts:["Shilabhadra","Nagarjuna","Dharmapala","Vasubandhu"], a:0, e:"<b>Shilabhadra</b> was Nalanda's chief teacher during Hiuen Tsang's visit, with over 10,000 students and 1,510 teachers."},
    {q:"Nalanda's library, formed by combining three buildings, held approximately how many books?", opts:["9 lakh","50 lakh","90 lakh","1 crore"], a:2, e:"Nalanda's library complex (Ratnaranjak, Ratnodadhi, Ratnasagar) held about <b>90 lakh books</b>."},
    {q:"How many villages were donated to finance Nalanda University's free residential education?", opts:["100","200","500","1000"], a:1, e:"<b>200 villages</b> were donated to cover Nalanda's expenses, making it a free residential centre."},
    {q:"Nalanda University was included in UNESCO's World Heritage list in which year?", opts:["2006","2010","2014","2016"], a:3, e:"Nalanda was declared a UNESCO World Heritage Site in <b>2016</b>. The Nalanda University Act was passed in 2010, and courses resumed in 2014, on a suggestion made by A.P.J. Abdul Kalam in 2006 — the four dates are a common trap."},
    {q:"Which ruler of Java patronized and promoted Nalanda University in later centuries?", opts:["Balaputradev","Devpala","Dharmapala","Gopala"], a:0, e:"<b>Balaputradev</b>, ruler of Java (Shailendra dynasty), promoted Nalanda; Devpala separately donated 5 villages to him for building a vihar there — the two names are easy to conflate."}
  ]
},
{
  title: "Pala Dynasty",
  qs: [
    {q:"The Pala dynasty was founded in 750 AD by:", opts:["Dharmapala","Gopala","Devpala","Rampala"], a:1, e:"<b>Gopala</b> founded the Pala dynasty in 750 AD and established Odantapuri University in Bihar Sharif."},
    {q:"Dharmapala, the most prominent Pala ruler, founded which university at Bhagalpur?", opts:["Nalanda University","Odantapuri University","Vikramshila University","Somapura Mahavihara"], a:2, e:"Dharmapala founded <b>Vikramshila University</b> at Bhagalpur; Somapura Mahavihara (now in Bangladesh) was a separate foundation of his."},
    {q:"Dharmapala assumed which title after his campaigns?", opts:["Uttarpathaswami","Vikramaditya","Ekachhatra","Devraj"], a:0, e:"Dharmapala took the title <b>'Uttarpathaswami'</b> after his tripartite struggle successes against the Pratiharas and Rashtrakutas."},
    {q:"Devpala, successor of Dharmapala from 810 AD, made which city his capital?", opts:["Vaishali","Munger","Pataliputra","Bhagalpur"], a:1, e:"Devpala made <b>Munger</b> his capital."},
    {q:"The bronze statues of the Pala period, famous for their artistry, are credited to:", opts:["Dhiman and Vithpal","Shilabhadra and Nagarjuna","Harishena and Vasumitra","Aryabhatta and Brahmagupta"], a:0, e:"Pala-period bronze art is attributed to <b>Dhiman and Vithpal</b>."}
  ]
}
];

let allQuestions = [];
sections.forEach((sec, si) => {
  sec.qs.forEach((q, qi) => allQuestions.push({...q, section: sec.title, sIdx: si, qIdx: qi}));
});

let score = 0;
let attempted = 0;

function render(){
  const root = document.getElementById('quizRoot');
  root.innerHTML = '';
  document.getElementById('totalVal').textContent = allQuestions.length;

  let counter = 0;
  sections.forEach((sec, si) => {
    const secTitle = document.createElement('div');
    secTitle.className = 'section-title';
    secTitle.textContent = sec.title;
    root.appendChild(secTitle);

    sec.qs.forEach((q, qi) => {
      counter++;
      const globalId = `q_${si}_${qi}`;
      const card = document.createElement('div');
      card.className = 'q-card';
      card.innerHTML = `
        <div class="q-num">Question ${counter}</div>
        <div class="q-text">${q.q}</div>
        <div class="options" id="opts_${globalId}"></div>
        <div class="explain" id="explain_${globalId}"><b>Explanation:</b> ${q.e}</div>
      `;
      root.appendChild(card);

      const optsDiv = card.querySelector(`#opts_${globalId}`);
      q.opts.forEach((optText, oi) => {
        const btn = document.createElement('button');
        btn.className = 'opt';
        btn.textContent = optText;
        btn.onclick = () => selectAnswer(globalId, si, qi, oi, optsDiv, card);
        optsDiv.appendChild(btn);
      });
    });
  });
}

function selectAnswer(globalId, si, qi, chosenIdx, optsDiv, card){
  if (optsDiv.dataset.answered === 'true') return;
  optsDiv.dataset.answered = 'true';

  const q = sections[si].qs[qi];
  const buttons = optsDiv.querySelectorAll('.opt');

  buttons.forEach((btn, idx) => {
    btn.classList.add('disabled');
    if (idx === q.a){
      btn.classList.add('correct');
    } else if (idx === chosenIdx){
      btn.classList.add('incorrect');
    } else {
      btn.classList.add('dim');
    }
  });

  card.querySelector('.explain').classList.add('show');

  attempted++;
  if (chosenIdx === q.a) score++;

  document.getElementById('scoreVal').textContent = score;
  document.getElementById('attemptedVal').textContent = attempted;
}

document.getElementById('resetBtn').onclick = () => {
  score = 0;
  attempted = 0;
  document.getElementById('scoreVal').textContent = 0;
  document.getElementById('attemptedVal').textContent = 0;
  render();
  window.scrollTo({top:0, behavior:'smooth'});
};

render();
</script>
