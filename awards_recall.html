<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Awards Recall</title>
<style>
:root{--bg:#0f131b;--sf:#171d29;--sf2:#1e2635;--ln:#2a3447;--tx:#e9edf4;--mu:#8b97ab;--ac:#54b8c4;--am:#e9b96e;--rd:#d9708a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:env(safe-area-inset-bottom,0)}
header{padding:calc(10px + env(safe-area-inset-top,0px)) 12px 0}
.stick{position:sticky;top:0;z-index:5;background:rgba(15,19,27,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--ln);padding:8px 12px 10px;padding-top:calc(8px + env(safe-area-inset-top,0px))}
h1{margin:0 0 8px;font:600 20px/1.2 Georgia,"Iowan Old Style",serif;letter-spacing:.2px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tab{border:1px solid var(--ln);background:var(--sf);color:var(--mu);padding:8px 12px;border-radius:10px;font:500 14px/1.2 inherit;font-family:inherit}
.tab.on{background:var(--ac);color:#08141a;border-color:var(--ac);font-weight:600}
.bar{display:flex;gap:6px}
.bar input{flex:1;min-width:0;background:var(--sf);border:1px solid var(--ln);color:var(--tx);border-radius:10px;padding:10px 12px;font:16px inherit;font-family:inherit}
.bar input:focus,.btn:focus-visible,.tab:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.btn{flex:none;background:var(--sf2);border:1px solid var(--ln);color:var(--tx);border-radius:10px;padding:0 12px;font:500 14px inherit;font-family:inherit}
.btn.hide{display:none}
.meta{color:var(--mu);font-size:13px;padding:8px 2px 0}
main{padding:8px 8px 40px}
.grid{display:grid;grid-template-columns:1fr 1fr 1.7fr;gap:0 10px}
.head{padding:8px 10px;color:var(--mu);font-size:13px;font-weight:600}
.row{display:contents;cursor:pointer}
.row>div{background:var(--sf);padding:14px 10px;border-top:1px solid var(--ln);overflow-wrap:anywhere;hyphens:auto}
.row>div:first-child{border-radius:12px 0 0 12px;border-left:3px solid var(--ac)}
.row>div:last-child{border-radius:0 12px 12px 0}
.row:active>div{background:var(--sf2)}
.aw{font:600 16px/1.35 Georgia,"Iowan Old Style",serif;color:var(--ac)}
.cat{display:block;margin-top:6px;font:500 12px/1.2 -apple-system,sans-serif;color:var(--mu)}
.rc{font-size:15px;line-height:1.4;margin-bottom:8px}
.rc:last-child{margin-bottom:0}
.rc b{font-weight:600;display:block}
.rc i{font-style:normal;color:var(--am);font-size:13px}
.dt{font-size:14.5px;line-height:1.55;color:#cfd6e3}
.sec{transition:filter .25s,opacity .25s}
.row:not(.open) .sec{filter:blur(9px);opacity:.55;user-select:none}
.row.open>div:first-child{border-left-color:var(--am)}
.row .gap{display:none}
.empty{padding:40px 10px;text-align:center;color:var(--mu)}
@media (prefers-reduced-motion:reduce){.sec{transition:none}}
@media (min-width:700px){main,header>*,.stick>*{max-width:900px;margin-inline:auto}}
</style>
</head>
<body>
<header>
  <h1>Awards Recall</h1>
  <div class="tabs" id="tabs" role="tablist"></div>
</header>
<div class="stick">
  <div class="bar">
    <input id="q" type="search" placeholder="Search award, person or detail" aria-label="Search">
    <button class="btn" id="toggle">Reveal all</button>
    <button class="btn hide" id="shuf">Shuffle</button>
  </div>
  <div class="meta" id="meta"></div>
</div>
<main><div class="grid" id="grid"></div></main>

const ALL = "All awards";
const rows = [];
Object.entries(DATA).forEach(([cat, list]) => list.forEach(r => rows.push({cat, aw:r[0], rc:r[1], dt:r[2], open:false})));

let tab = Object.keys(DATA)[0], order = [], query = "";
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function reshuffle(){ order = shuffle(rows.slice()); }

function visible(){
  let list = tab === ALL ? order : rows.filter(r => r.cat === tab);
  const q = query.trim().toLowerCase();
  if(q) list = list.filter(r => (r.aw + " " + r.rc.map(x => x.join(" ")).join(" ") + " " + r.dt).toLowerCase().includes(q));
  return list;
}

function render(){
  const list = visible();
  const g = $("grid");
  g.innerHTML = list.length
    ? (HEADS[tab]||["Award","Recipient","Details"]).map(h=>`<div class="head">${h}</div>`).join("") +
      list.map((r,i) => `<div class="row${r.open?" open":""}" data-i="${i}" role="button" tabindex="0" aria-expanded="${r.open}">
        <div><span class="aw">${esc(r.aw)}</span>${tab===ALL?`<span class="cat">${esc(LABEL[r.cat]||r.cat)}</span>`:""}</div>
        <div><div class="sec">${r.rc.map(x=>`<div class="rc"><b>${esc(x[0])}</b><i>${esc(x[1])}</i></div>`).join("")}</div></div>
        <div><div class="sec dt">${esc(r.dt)}</div></div></div>`).join("")
    : `<div class="empty" style="grid-column:1/-1">No awards match your search.</div>`;
  g._list = list;
  const n = list.filter(r => r.open).length;
  $("meta").textContent = `${list.length} awards, ${n} revealed`;
  $("toggle").textContent = list.length && n === list.length ? "Hide all" : "Reveal all";
  $("shuf").classList.toggle("hide", tab !== ALL);
}

function renderTabs(){
  $("tabs").innerHTML = [...Object.keys(DATA), ALL].map(t =>
    `<button class="tab${t===tab?" on":""}" role="tab" aria-selected="${t===tab}" data-t="${esc(t)}">${esc(t)}</button>`).join("");
}

function flip(row){
  const r = $("grid")._list[row.dataset.i];
  r.open = !r.open;
  row.classList.toggle("open", r.open);
  row.setAttribute("aria-expanded", r.open);
  const list = $("grid")._list, n = list.filter(x => x.open).length;
  $("meta").textContent = `${list.length} awards, ${n} revealed`;
  $("toggle").textContent = n === list.length ? "Hide all" : "Reveal all";
}

$("grid").addEventListener("click", e => { const row = e.target.closest(".row"); if(row) flip(row); });
$("grid").addEventListener("keydown", e => { if(e.key==="Enter"||e.key===" "){ const row = e.target.closest(".row"); if(row){ e.preventDefault(); flip(row); } } });
$("tabs").addEventListener("click", e => {
  const b = e.target.closest(".tab"); if(!b) return;
  tab = b.dataset.t; rows.forEach(r => r.open = false);
  if(tab === ALL) reshuffle();
  renderTabs(); render(); window.scrollTo(0,0);
});
$("q").addEventListener("input", e => { query = e.target.value; render(); });
$("toggle").addEventListener("click", () => {
  const list = visible(), all = list.length && list.every(r => r.open);
  list.forEach(r => r.open = !all); render();
});
$("shuf").addEventListener("click", () => { rows.forEach(r => r.open = false); reshuffle(); render(); window.scrollTo(0,0); });

reshuffle(); renderTabs(); render();
</script>
